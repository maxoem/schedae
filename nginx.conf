server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Restrict HTTP methods to read-only
    if ($request_method !~ ^(GET|HEAD)$ ) {
        return 405;
    }

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml;

    # Internal health check
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Dynamic SEO files generated at container startup in /tmp
    location = /sitemap.xml {
        root /tmp;
        try_files /sitemap.xml =404;
        include /tmp/security_headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        root /tmp;
        try_files /robots.txt =404;
        include /tmp/security_headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Cache immutable static assets (with full security headers)
    location ~* \.(?:js|css|wasm|woff2?|eot|ttf|otf|ico|svg|png|jpg|jpeg|gif|webp)$ {
        include /tmp/security_headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Serve dynamically configured index.html from /tmp
    location = /index.html {
        root /tmp;
        try_files /index.html =404;
        include /tmp/security_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA Routing: Fall back to index.html with no-cache and full security headers
    # Note: Omit $uri/ so root "/" immediately redirects to /index.html in /tmp
    location / {
        include /tmp/security_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
