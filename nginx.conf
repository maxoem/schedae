server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Restrict HTTP methods to read-only
    if ($request_method !~ ^(GET|HEAD)$ ) {
        return 405;
    }

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml;

    # Internal health check
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Dynamic SEO files generated at container startup in /tmp
    location = /sitemap.xml {
        root /tmp;
        try_files /sitemap.xml =404;
        include /tmp/security_headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        root /tmp;
        try_files /robots.txt =404;
        include /tmp/security_headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Cache immutable static assets (with full security headers)
    location ~* \.(?:js|css|wasm|woff2?|eot|ttf|otf|ico|svg|png|jpg|jpeg|gif|webp)$ {
        include /tmp/security_headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Permanent redirects for legacy/duplicate routes
    location = /json-to-apkg {
        include /tmp/security_headers.conf;
        return 301 /;
    }
    location = /refurbish {
        include /tmp/security_headers.conf;
        return 301 /remaster;
    }
    location = /open-access {
        include /tmp/security_headers.conf;
        return 301 /open-source;
    }

    # Serve dynamically configured HTML files from /tmp/html
    location ~ \.html$ {
        root /tmp/html;
        try_files $uri =404;
        include /tmp/security_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Serve pre-rendered HTML routes from /tmp/html, falling back to /tmp/html/index.html for SPA routes
    location @prerendered {
        root /tmp/html;
        include /tmp/security_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri.html $uri/index.html /index.html;
    }

    # Static files or pre-rendered / SPA fallback
    location / {
        include /tmp/security_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri @prerendered;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
